name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Vulnerability audit
        shell: pwsh
        run: |
          $json = dotnet list package --vulnerable --include-transitive --format json 2>$null | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet list package failed with exit code $LASTEXITCODE"
          }

          $report = $json | ConvertFrom-Json
          $vulnerable = @(
            foreach ($project in $report.projects) {
              foreach ($framework in @($project.frameworks)) {
                foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                  if ($null -ne $package -and $package.vulnerabilities) {
                    "$($package.id) $($package.resolvedVersion)"
                  }
                }
              }
            }
          )

          if ($vulnerable.Count -gt 0) {
            throw "vulnerable NuGet packages were found: $($vulnerable -join ', ')"
          }

      - name: Publish
        run: |
          dotnet publish src/Vitals/Vitals.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke.ps1 -Exe ./dist/vitals.exe -RequireSchema

      - uses: actions/upload-artifact@v7
        with:
          name: vitals-win-x64
          path: dist/vitals.exe
          if-no-files-found: error
