name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/vitals-win-x64.zip
          $hash = Get-ChildItem dist/vitals-win-x64.zip.sha256
          gh release create $env:GITHUB_REF_NAME $zip.FullName $hash.FullName `
            --title "vitals $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
