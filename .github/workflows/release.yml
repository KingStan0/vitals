name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/vitals-win-x64.zip
          $hash = Get-ChildItem dist/vitals-win-x64.zip.sha256
          $notes = 'Windows x64 build. Download vitals-win-x64.zip, extract it, and run vitals.cmd. The exe is unsigned, so SmartScreen may warn. See the README for PawnIO, sensors and CLI usage.'
          gh release create $env:GITHUB_REF_NAME $zip.FullName $hash.FullName `
            --title "vitals $env:GITHUB_REF_NAME" `
            --notes $notes `
            --generate-notes `
            --verify-tag
