name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "release tags must look like v1.2.3, got: $env:GITHUB_REF_NAME"
          }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/vitals-*-win-x64.zip'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist -Filter 'vitals-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'release zip was not created' }
          $hash = Get-Item "$($zip.FullName).sha256"
          $notes = "Windows x64 build. Download $($zip.Name), extract it, and run vitals.cmd. The exe is unsigned, so SmartScreen may warn. See the README for PawnIO, sensors and CLI usage.`n`nVerify the checksum with $($hash.Name), or run: gh attestation verify $($zip.Name) --repo $env:GITHUB_REPOSITORY"
          gh release create $env:GITHUB_REF_NAME $zip.FullName $hash.FullName `
            --title "vitals $env:GITHUB_REF_NAME" `
            --notes $notes `
            --generate-notes `
            --verify-tag
